name = "Nuclear"
grammar = "nuclear"
path_suffixes = ["nuc"]
line_comments = ["// "]
# Enter inside `// text` continues with ` * ` under the second `/`; the server's on-type formatting removes an empty ` *`
documentation_comment = { start = "//", prefix = "* ", end = "", tab_size = 1 }
tab_size = 2
hard_tabs = false
autoclose_before = ")]},:"
word_characters = ["_", "$"]
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
# the same rules as VS Code (vscode/language-configuration.json)
increase_indent_pattern = "(?:^\\s*(?:if|else|for|while|match|try|catch|finally)\\b.*$)|(?:^.*(?:=>|->)\\s*$)|(?:^.*=\\s*\\([^()]*\\)(?:\\s+[\\w<>\\[\\]?, ]+)?\\s*$)|(?:^.*\\(\\s*[A-Za-z_]\\w*\\??\\s*:[^()]*\\)\\s*$)|(?:^\\s*\\([^()]*\\)\\s*$)|(?:^\\s*(?:[a-z_]\\w*\\s+)*~?[a-z_]\\w*(?:<[^>]*>)?\\([^()]*(?:\\([^()]*\\)[^()]*)*\\)\\s+[\\w<>\\[\\]?,. ]+$)|(?:^(?:[a-z_]\\w*\\s+)*[A-Z]\\w*(?:<[^>]*>)?(?:\\([^()]*\\))?(?:\\s*[:>]\\s*[\\w<>\\[\\]?,. ]+)?(?:\\s+[a-z_]\\w*\\s+[\\w<>\\[\\]?,. ]+)?\\s*$)|(?:^\\s*(?:[a-z_]\\w*\\s+)*[A-Z]\\w*\\s*$)"
decrease_indent_pattern = "^\\s*(?:else|catch|finally)\\b"
